name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.editorconfig'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.editorconfig'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't let one platform's failure cancel the others — we want to see each
      # platform's real result independently (a flake on one shouldn't hide the rest).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # NOTE: if macOS is ever restored to the matrix, resurrect the
      # "Register hostname in /etc/hosts (macOS mDNS workaround)" step removed in
      # the 2026-07 cleanup (git history) — without it, every http server.listen()
      # burns mDNSResponder's 5s timeout (measured: A-only 5053ms, A+AAAA 10ms).
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The conformance harnesses live outside SharpTS.sln (running them needs the
      # external/ submodules, absent here), but each references SharpTS.csproj — so
      # compile them to catch API rot that would otherwise only surface when someone
      # runs them manually.
      - name: Build conformance harnesses (compile-only)
        shell: bash
        run: |
          dotnet build SharpTS.Test262/SharpTS.Test262.csproj --configuration Release
          dotnet build SharpTS.Test262.Worker/SharpTS.Test262.Worker.csproj --configuration Release
          dotnet build SharpTS.TypeScriptConformance/SharpTS.TypeScriptConformance.csproj --configuration Release

      # Category!=LiveNetwork excludes the opt-in tests that make real outbound
      # DNS/HTTP calls (tagged [Trait("Category","LiveNetwork")]); those depend on
      # the runner's network and false-red CI (#495). Run them on demand locally:
      # dotnet test --filter "Category=LiveNetwork"
      #
      # Category!=LoadSensitive is the same quarantine for tests that inherently
      # depend on load/wall-clock timing (#1215 policy): the default suite must
      # contain no test we know can fail without a code defect. Currently no test
      # carries the tag — every known load-flake was fixed at the product level
      # (#1211/#1212/#1213) — but any future inherently-timing-dependent test gets
      # [Trait("Category","LoadSensitive")] and is excluded here automatically.
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal --filter "Category!=LiveNetwork&Category!=LoadSensitive"
        timeout-minutes: 10

  # AOT-compatibility ratchet (#1324 Track 0). Builds SharpTS.csproj with the
  # AOT/trim/single-file analyzers and compares the number of distinct IL####
  # warnings against the committed baseline (.github/aot-warning-baseline.txt).
  # The comparison is exact in BOTH directions: above the baseline fails (a PR
  # introduced new AOT-incompatible code), and below it also fails with an ask
  # to lower the baseline — otherwise fixed warnings leave slack under which
  # later regressions hide, defeating the ratchet. The counts are OS-independent
  # (Roslyn analyzers over the same sources), so one ubuntu job suffices.
  aot-ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build with AOT/trim/single-file analyzers
        run: |
          set -o pipefail
          dotnet build SharpTS.csproj --configuration Release \
            -p:IsAotCompatible=true \
            -p:EnableAotAnalyzer=true \
            -p:EnableTrimAnalyzer=true \
            -p:EnableSingleFileAnalyzer=true \
            | tee aot-analyzer.log | grep -E 'Warning\(s\)|Error\(s\)|error ' || true
          # Fail the step on build errors even though we filtered the output.
          grep -qE '^\s*0 Error\(s\)' aot-analyzer.log

      - name: Enforce warning-count ratchet
        run: |
          baseline=$(tr -cd '0-9' < .github/aot-warning-baseline.txt)
          # sort -u collapses MSBuild's duplicate printing (inline + summary)
          # of the same warning line.
          count=$(grep -E 'warning IL[0-9]{4}' aot-analyzer.log | sort -u | wc -l)
          echo "AOT/trim/single-file analyzer warnings: $count (baseline: $baseline)"
          grep -oE 'warning IL[0-9]{4}' aot-analyzer.log | sort | uniq -c | sort -rn
          if [ "$count" -gt "$baseline" ]; then
            echo "::error::AOT analyzer warnings increased from $baseline to $count. New AOT/trim-incompatible code was introduced — fix it, or (only if intentional) raise .github/aot-warning-baseline.txt with justification."
            exit 1
          elif [ "$count" -lt "$baseline" ]; then
            echo "::error::AOT analyzer warnings decreased from $baseline to $count — nice! Lower .github/aot-warning-baseline.txt to $count in this PR so the improvement is locked in."
            exit 1
          fi

      # The full warning list (2700+ lines) is deliberately not echoed to the
      # job log; grab it here when diagnosing a ratchet failure.
      - name: Upload analyzer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aot-analyzer-log
          path: aot-analyzer.log
