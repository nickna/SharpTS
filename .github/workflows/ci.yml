name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.editorconfig'

  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce workflow policy
        shell: pwsh
        run: ./scripts/test-github-workflows.ps1

      - name: Install and run actionlint 1.7.12
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file actionlint.tar.gz actionlint
          ./actionlint

  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # Don't let one platform's failure cancel the others — we want to see each
      # platform's real result independently (a flake on one shouldn't hide the rest).
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # NOTE: if macOS is ever restored to the matrix, resurrect the
      # "Register hostname in /etc/hosts (macOS mDNS workaround)" step removed in
      # the 2026-07 cleanup (git history) — without it, every http server.listen()
      # burns mDNSResponder's 5s timeout (measured: A-only 5053ms, A+AAAA 10ms).
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Pack and smoke test interpreter debug adapter tool
        shell: pwsh
        run: |
          dotnet pack src/SharpTS.DebugAdapter/SharpTS.DebugAdapter.csproj `
            --no-build --configuration Release --output artifacts/dap-tool
          dotnet tool install SharpTS.DebugAdapter `
            --tool-path artifacts/dap-tool-install `
            --add-source artifacts/dap-tool --prerelease --ignore-failed-sources
          $shimName = if ($IsWindows) { 'sharpts-dap.exe' } else { 'sharpts-dap' }
          & (Join-Path 'artifacts/dap-tool-install' $shimName) --version

      - name: Setup Node for VS Code extension packaging
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: extensions/vscode-sharpts/package-lock.json

      - name: Package VS Code extension with interpreter adapter
        if: matrix.os == 'ubuntu-24.04'
        working-directory: extensions/vscode-sharpts
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm test
          npm run package
          unzip -l vscode-sharpts-*.vsix | grep 'extension/bin/server/SharpTS.DebugAdapter.dll'

      # Discover and type-check/compile every cross-runtime workload through the
      # real runner. This catches repository moves and declaration drift without
      # paying the cost (or accepting the noise) of timing benchmarks in CI.
      - name: Smoke test benchmark harnesses
        shell: pwsh
        run: |
          ./scripts/test-perf-local.ps1
          ./benchmarks/cross-runtime/run-benchmarks.ps1 -Smoke -NoBuild
          dotnet run --configuration Release --no-build `
            --project benchmarks/micro/SharpTS.Microbenchmarks -- --smoke
        timeout-minutes: 10

      # The conformance harnesses live outside SharpTS.sln (running them needs the
      # external/ submodules, absent here), but each references src/SharpTS/SharpTS.csproj — so
      # compile them to catch API rot that would otherwise only surface when someone
      # runs them manually.
      - name: Build conformance harnesses (compile-only)
        shell: bash
        run: |
          dotnet build tests/conformance/SharpTS.Test262/SharpTS.Test262.csproj --configuration Release
          dotnet build tests/conformance/SharpTS.Test262.Worker/SharpTS.Test262.Worker.csproj --configuration Release
          dotnet build tests/conformance/SharpTS.TypeScriptConformance/SharpTS.TypeScriptConformance.csproj --configuration Release

      # Category!=LiveNetwork excludes the opt-in tests that make real outbound
      # DNS/HTTP calls (tagged [Trait("Category","LiveNetwork")]); those depend on
      # the runner's network and false-red CI (#495). Run them on demand locally:
      # dotnet test --filter "Category=LiveNetwork"
      #
      # Category!=LoadSensitive is the same quarantine for tests that inherently
      # depend on load/wall-clock timing (#1215 policy): the default suite must
      # contain no test we know can fail without a code defect. Currently no test
      # carries the tag — every known load-flake was fixed at the product level
      # (#1211/#1212/#1213) — but any future inherently-timing-dependent test gets
      # [Trait("Category","LoadSensitive")] and is excluded here automatically.
      #
      # Category!=npm excludes tests that run a real `npm install` against
      # registry.npmjs.org (RealPackageSmokeTests) — same hermeticity policy as
      # LiveNetwork; the host-literal guardrail can't see package-name installs.
      # Run them on demand locally: dotnet test --filter "Category=npm"
      - name: Test core
        run: dotnet test tests/SharpTS.Tests/SharpTS.Tests.csproj --no-build --configuration Release --verbosity normal --filter "Category!=LiveNetwork&Category!=LoadSensitive&Category!=npm"
        timeout-minutes: 10

      - name: Test GUI conformance
        run: dotnet test tests/gui-conformance/SharpTS.Gui.Conformance.Tests/SharpTS.Gui.Conformance.Tests.csproj --no-build --configuration Release --verbosity normal --filter "Category!=LiveNetwork&Category!=LoadSensitive&Category!=npm"
        timeout-minutes: 10

      - name: Test NuGet release helper
        shell: pwsh
        run: ./scripts/test-nuget-release.ps1

      - name: Test GUI version staging
        shell: pwsh
        run: ./scripts/test-gui-version.ps1

      # Exercise the SDK through its nupkg rather than repository-relative build
      # outputs. The script uses a local-only feed, a clean package cache, and no
      # global dotnet-tool directory on PATH.
      - name: Packaged SDK smoke test
        shell: pwsh
        run: ./scripts/test-packaged-sdk.ps1

  # The full suite intentionally stays off macOS, but the interpreter debugger is a portable .NET
  # tool and its product contract requires a real package/install/launch smoke on every supported
  # desktop platform.
  dap-macos-smoke:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore debugger tests
        run: dotnet restore tests/SharpTS.Tests/SharpTS.Tests.csproj
      - name: Build debugger tests
        run: dotnet build tests/SharpTS.Tests/SharpTS.Tests.csproj --no-restore --configuration Release
      - name: Pack and install interpreter debug adapter
        shell: pwsh
        run: |
          dotnet pack src/SharpTS.DebugAdapter/SharpTS.DebugAdapter.csproj `
            --no-build --configuration Release --output artifacts/dap-tool
          dotnet tool install SharpTS.DebugAdapter `
            --tool-path artifacts/dap-tool-install `
            --add-source artifacts/dap-tool --prerelease --ignore-failed-sources
          ./artifacts/dap-tool-install/sharpts-dap --version
      - name: Launch real programs through raw DAP
        run: >-
          dotnet test tests/SharpTS.Tests/SharpTS.Tests.csproj
          --no-build --configuration Release
          --filter "FullyQualifiedName~SharpTS.Tests.DebugAdapter.DapEndToEndTests"

  # AOT-compatibility ratchet (#1324 Track 0). Builds src/SharpTS/SharpTS.csproj with the
  # AOT/trim/single-file analyzers compare the distinct IL#### inventory against
  # .github/aot-warning-baseline.json. The structured baseline pins total,
  # per-code, per-area, and per-file/code counts, so replacing a fixed warning
  # with a different warning cannot hide behind an unchanged scalar total.
  # Counts are OS-independent (Roslyn analyzers over the same sources), so one
  # ubuntu job suffices.
  aot-ratchet:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build and enforce AOT analyzer inventory
        shell: pwsh
        run: ./scripts/aot-analyzer-report.ps1 -EnforceBaseline

      # The full warning list is deliberately not echoed to the job log; the
      # summary makes category drift visible, and the log retains every callsite.
      - name: Upload analyzer log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aot-analyzer-log
          path: |
            aot-analyzer.log
            aot-analyzer-summary.json
          retention-days: 7

  # The managed xUnit suite cannot exercise the Native-AOT-hosted compiler: it loads
  # emitted assemblies back into the test process. Publish a real native SharpTS host,
  # compile through both the single-file and module-graph pipelines, and run the managed
  # outputs under CoreCLR. This permanently covers the Reflection.Emit fallbacks that only
  # execute when RuntimeFeature.IsDynamicCodeSupported is false (#1324 gate).
  native-aot-compile-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # The native compiler carries an ordinary AnyCPU SharpTS.dll for compiled
      # programs that late-bind to interpreter/runtime features. This must be a
      # separate first build: an assembly cannot embed itself while it is being
      # compiled.
      - name: Build managed runtime payload
        run: |
          dotnet publish src/SharpTS/SharpTS.csproj --configuration Release \
            -p:PlatformTarget=AnyCPU \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o artifacts/managed-runtime

      # TrimMode/IlcTrimMetadata/IlcGenerateCompleteTypeMetadata/StackTraceSupport
      # are owned by src/SharpTS/SharpTS.csproj behind PublishAot=true so local publishes get
      # the same mandatory configuration as CI.
      - name: Publish Native AOT SharpTS
        run: |
          set -o pipefail
          dotnet publish src/SharpTS/SharpTS.csproj --configuration Release -r linux-x64 \
            -p:PublishAot=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:SharpTSManagedRuntimePayloadPath="$PWD/artifacts/managed-runtime/SharpTS.dll" \
            -o artifacts/native-aot 2>&1 | tee artifacts/native-aot-publish.log

      # SDK analyzers run before linking and therefore cannot see warnings
      # introduced by ILC reachability or dependency closures. Exact-match only
      # SharpTS-owned subjects; external diagnostics remain visible without
      # making .NET SDK servicing changes fail the build.
      - name: Enforce Native AOT publish warning inventory
        shell: pwsh
        run: |
          ./scripts/aot-publish-warning-report.ps1 `
            -LogPath artifacts/native-aot-publish.log `
            -SummaryPath artifacts/native-aot-publish-warning-summary.json `
            -EnforceBaseline

      - name: Compile and execute from the native host
        shell: bash
        run: |
          set -euo pipefail
          native="$PWD/artifacts/native-aot/SharpTS"
          scratch="$(mktemp -d)"

          if "$native" --compile samples/AotCompileGate/main.ts --target dll --hosted \
              -o "$scratch/hosted.dll" > "$scratch/hosted-error.txt" 2>&1; then
            echo "Native AOT compiler unexpectedly accepted --hosted" >&2
            exit 1
          fi
          grep -q 'Native AOT/single-file SharpTS compiler does not support --hosted' \
            "$scratch/hosted-error.txt"
          test ! -e "$scratch/hosted.dll"

          "$native" samples/AotCompileGate/main.ts > "$scratch/interpreted.txt"
          grep -qx '42' "$scratch/interpreted.txt"

          # An empty DOTNET_ROOT proves reference rewriting uses PE-Packer's embedded
          # net10 index rather than an installed reference pack.
          empty_dotnet_root="$(mktemp -d)"
          DOTNET_ROOT="$empty_dotnet_root" "$native" --compile \
            samples/AotCompileGate/main.ts --ref-asm -o "$scratch/modules.dll"
          dotnet "$scratch/modules.dll" > "$scratch/modules.txt"
          diff -u "$scratch/interpreted.txt" "$scratch/modules.txt"

          # Accessors + sync/async generators exercise raw custom-attribute blobs
          # and MethodBuilderInstantiation (async builder Start<TStateMachine>).
          # The generic class/array/Promise<UserClass> section closes runtime open
          # generics over TypeBuilder args, forcing the TypeBuilderInstantiation
          # fallback — without it, only the async path's fallback ever executes.
          "$native" --compile samples/AotCompileGate/features.ts --ref-asm \
            -o "$scratch/features.dll"
          dotnet "$scratch/features.dll" > "$scratch/features.txt"
          grep -qx '2 2 33 7 11 0 prototype async generator' "$scratch/features.txt"

          # Known CLR attribute mappings use closed constructor metadata and remain
          # available in the native compiler; only arbitrary @attribute("Type")
          # discovery belongs to the managed interop boundary.
          "$native" --compile samples/AotCompileGate/known-attribute.ts \
            --experimentalDecorators --ref-asm -o "$scratch/known-attribute.dll"
          dotnet "$scratch/known-attribute.dll" > "$scratch/known-attribute.txt"
          grep -qx 'true' "$scratch/known-attribute.txt"

          # A soft-dependency compile extracts the embedded AnyCPU SharpTS.dll.
          # Running eval proves this is a usable managed payload, not merely a
          # resource/copy assertion.
          mkdir "$scratch/softdep"
          "$native" --compile samples/AotCompileGate/softdep.ts --ref-asm \
            -o "$scratch/softdep/softdep.dll"
          test -f "$scratch/softdep/SharpTS.dll" || {
            echo "dynamic eval compile did not extract SharpTS.dll" >&2
            exit 1
          }
          dotnet "$scratch/softdep/softdep.dll" > "$scratch/softdep.txt"
          grep -qx '42' "$scratch/softdep.txt"

          # fork needs a second compiler process and is deliberately absent from
          # the native SKU. Fail before writing a misleading output assembly.
          if "$native" --compile samples/AotCompileGate/fork.ts \
              -o "$scratch/fork.dll" 2> "$scratch/fork-error.txt"; then
            echo "child_process.fork unexpectedly compiled under Native AOT"
            exit 1
          fi
          bash scripts/assert-managed-build-required.sh \
            "$scratch/fork-error.txt" 'child_process.fork'
          test ! -f "$scratch/fork.dll"

          # Managed-only public boundaries must fail before their reflection/loader paths.
          if "$native" samples/AotCompileGate/main.ts \
              -r "$PWD/artifacts/managed-runtime/SharpTS.dll" \
              > "$scratch/reference-error.txt" 2>&1; then
            echo "third-party reference loading unexpectedly ran under Native AOT"
            exit 1
          fi
          bash scripts/assert-managed-build-required.sh \
            "$scratch/reference-error.txt" 'loading .NET reference assemblies'

          # The official native SKU exposes a curated, linker-rooted BCL catalog
          # through both execution paths. The universe remains closed: an import
          # outside that catalog must fail before arbitrary reflection.
          "$native" samples/AotCompileGate/dotnet-interop.ts \
            > "$scratch/dotnet-interop.txt"
          grep -qx 'native-dotnet-42' "$scratch/dotnet-interop.txt"
          "$native" --compile samples/AotCompileGate/dotnet-interop.ts --ref-asm \
            -o "$scratch/dotnet-interop.dll"
          dotnet "$scratch/dotnet-interop.dll" > "$scratch/dotnet-interop-compiled.txt"
          diff -u "$scratch/dotnet-interop.txt" "$scratch/dotnet-interop-compiled.txt"

          if "$native" samples/AotCompileGate/dotnet-interop-unknown.ts \
              > "$scratch/dotnet-interop-error.txt" 2>&1; then
            echo "an unregistered .NET type unexpectedly ran under Native AOT"
            exit 1
          fi
          grep -Fq 'not present in this native SharpTS catalog' \
            "$scratch/dotnet-interop-error.txt"

          if "$native" --gen-decl System.String \
              > "$scratch/gen-decl-error.txt" 2>&1; then
            echo "declaration discovery unexpectedly ran under Native AOT"
            exit 1
          fi
          bash scripts/assert-managed-build-required.sh \
            "$scratch/gen-decl-error.txt" '--gen-decl'

          if "$native" --compile samples/AotCompileGate/main.ts --verify \
              -o "$scratch/verify.dll" \
              > "$scratch/verify-error.txt" 2>&1; then
            echo "IL verification unexpectedly ran under Native AOT"
            exit 1
          fi
          bash scripts/assert-managed-build-required.sh \
            "$scratch/verify-error.txt" '--verify'
          test ! -f "$scratch/verify.dll"

          # Exercise PE-Packer from inside SharpTS's partial-trim closure too.
          # The same empty DOTNET_ROOT used above also proves executable creation
          # comes from PE-Packer's embedded apphost rather than the runner's SDK.
          DOTNET_ROOT="$empty_dotnet_root" "$native" --compile \
            samples/AotCompileGate/main.ts -t exe \
            -o "$scratch/modules"
          "$scratch/modules" > "$scratch/bundled.txt"
          diff -u "$scratch/interpreted.txt" "$scratch/bundled.txt"

      # MinimumExecuted: the corpus currently executes ~22 cases per path × 3
      # paths; 50 fails the job if a whole path (or most of the corpus) starts
      # silently skipping, while leaving headroom for deliberate corpus edits.
      - name: Drive Examples corpus from the native host
        shell: pwsh
        run: |
          ./samples/test-examples.ps1 `
            -SharpTSExe "$PWD/artifacts/native-aot/SharpTS" `
            -NativeSku `
            -Mode all `
            -MinimumExecuted 50 `
            -OutputFormat table

      - name: Publish and exercise a custom native interop host
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          dotnet publish samples/NativeInteropHost/NativeInteropHost.csproj \
            --configuration Release -r linux-x64 \
            -o "$scratch/host"
          "$scratch/host/NativeInteropHost" \
            samples/NativeInteropHost/custom-interop.ts > "$scratch/interpreted.txt"
          grep -qx 'changed' "$scratch/interpreted.txt"
          grep -qx '42 42 counter' "$scratch/interpreted.txt"
          grep -qx '3' "$scratch/interpreted.txt"

          mkdir "$scratch/output"
          "$scratch/host/NativeInteropHost" --compile \
            samples/NativeInteropHost/custom-interop.ts --ref-asm \
            -o "$scratch/output/custom.dll"
          test -f "$scratch/output/NativeInteropExample.dll"
          test ! -f "$scratch/output/System.Runtime.dll"
          dotnet "$scratch/output/custom.dll" > "$scratch/compiled.txt"
          diff -u "$scratch/interpreted.txt" "$scratch/compiled.txt"

      - name: Upload Native AOT publish diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-aot-publish-diagnostics
          if-no-files-found: ignore
          path: |
            artifacts/native-aot-publish.log
            artifacts/native-aot-publish-warning-summary.json
          retention-days: 7

  gate:
    name: Gate
    if: always()
    needs: [workflow-policy, build, dap-macos-smoke, aot-ratchet, native-aot-compile-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job to pass
        shell: pwsh
        env:
          JOB_RESULTS: ${{ toJson(needs) }}
        run: |
          $needs = $env:JOB_RESULTS | ConvertFrom-Json
          $bad = @($needs.PSObject.Properties | Where-Object { $_.Value.result -ne 'success' })
          if ($bad.Count -gt 0) {
            throw "CI jobs did not pass: $($bad.Name -join ', ')"
          }
