name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.editorconfig'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.editorconfig'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't let one platform's failure cancel the others — we want to see each
      # platform's real result independently (a flake on one shouldn't hide the rest).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # NOTE: if macOS is ever restored to the matrix, resurrect the
      # "Register hostname in /etc/hosts (macOS mDNS workaround)" step removed in
      # the 2026-07 cleanup (git history) — without it, every http server.listen()
      # burns mDNSResponder's 5s timeout (measured: A-only 5053ms, A+AAAA 10ms).
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The conformance harnesses live outside SharpTS.sln (running them needs the
      # external/ submodules, absent here), but each references SharpTS.csproj — so
      # compile them to catch API rot that would otherwise only surface when someone
      # runs them manually.
      - name: Build conformance harnesses (compile-only)
        shell: bash
        run: |
          dotnet build SharpTS.Test262/SharpTS.Test262.csproj --configuration Release
          dotnet build SharpTS.Test262.Worker/SharpTS.Test262.Worker.csproj --configuration Release
          dotnet build SharpTS.TypeScriptConformance/SharpTS.TypeScriptConformance.csproj --configuration Release

      # Category!=LiveNetwork excludes the opt-in tests that make real outbound
      # DNS/HTTP calls (tagged [Trait("Category","LiveNetwork")]); those depend on
      # the runner's network and false-red CI (#495). Run them on demand locally:
      # dotnet test --filter "Category=LiveNetwork"
      #
      # Category!=LoadSensitive is the same quarantine for tests that inherently
      # depend on load/wall-clock timing (#1215 policy): the default suite must
      # contain no test we know can fail without a code defect. Currently no test
      # carries the tag — every known load-flake was fixed at the product level
      # (#1211/#1212/#1213) — but any future inherently-timing-dependent test gets
      # [Trait("Category","LoadSensitive")] and is excluded here automatically.
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal --filter "Category!=LiveNetwork&Category!=LoadSensitive"
        timeout-minutes: 10

  # AOT-compatibility ratchet (#1324 Track 0). Builds SharpTS.csproj with the
  # AOT/trim/single-file analyzers compare the distinct IL#### inventory against
  # .github/aot-warning-baseline.json. The structured baseline pins total,
  # per-code, per-area, and per-file/code counts, so replacing a fixed warning
  # with a different warning cannot hide behind an unchanged scalar total.
  # Counts are OS-independent (Roslyn analyzers over the same sources), so one
  # ubuntu job suffices.
  aot-ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and enforce AOT analyzer inventory
        shell: pwsh
        run: ./scripts/aot-analyzer-report.ps1 -EnforceBaseline

      # The full warning list is deliberately not echoed to the job log; the
      # summary makes category drift visible, and the log retains every callsite.
      - name: Upload analyzer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aot-analyzer-log
          path: |
            aot-analyzer.log
            aot-analyzer-summary.json

  # The managed xUnit suite cannot exercise the Native-AOT-hosted compiler: it loads
  # emitted assemblies back into the test process. Publish a real native SharpTS host,
  # compile through both the single-file and module-graph pipelines, and run the managed
  # outputs under CoreCLR. This permanently covers the Reflection.Emit fallbacks that only
  # execute when RuntimeFeature.IsDynamicCodeSupported is false (#1324 gate).
  native-aot-compile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # The native compiler carries an ordinary AnyCPU SharpTS.dll for compiled
      # programs that late-bind to interpreter/runtime features. This must be a
      # separate first build: an assembly cannot embed itself while it is being
      # compiled.
      - name: Build managed runtime payload
        run: |
          dotnet publish SharpTS.csproj --configuration Release \
            -p:PlatformTarget=AnyCPU \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o artifacts/managed-runtime

      - name: Publish Native AOT SharpTS
        run: |
          dotnet publish SharpTS.csproj --configuration Release -r linux-x64 \
            -p:PublishAot=true \
            -p:TrimMode=partial \
            -p:IlcTrimMetadata=false \
            -p:IlcGenerateCompleteTypeMetadata=true \
            -p:StackTraceSupport=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:SharpTSManagedRuntimePayloadPath="$PWD/artifacts/managed-runtime/SharpTS.dll" \
            -o artifacts/native-aot

      - name: Compile and execute from the native host
        shell: bash
        run: |
          set -euo pipefail
          native="$PWD/artifacts/native-aot/SharpTS"
          scratch="$(mktemp -d)"

          "$native" Examples/AotCompileGate/main.ts > "$scratch/interpreted.txt"
          grep -qx '42' "$scratch/interpreted.txt"

          # An empty DOTNET_ROOT proves reference rewriting uses PE-Packer's embedded
          # net10 index rather than an installed reference pack.
          empty_dotnet_root="$(mktemp -d)"
          DOTNET_ROOT="$empty_dotnet_root" "$native" --compile \
            Examples/AotCompileGate/main.ts --ref-asm -o "$scratch/modules.dll"
          dotnet "$scratch/modules.dll" > "$scratch/modules.txt"
          diff -u "$scratch/interpreted.txt" "$scratch/modules.txt"

          # Accessors + sync/async generators exercise raw custom-attribute blobs,
          # TypeBuilderInstantiation and MethodBuilderInstantiation.
          "$native" --compile Examples/AotCompileGate/features.ts --ref-asm \
            -o "$scratch/features.dll"
          dotnet "$scratch/features.dll" > "$scratch/features.txt"
          grep -qx '2 2 33' "$scratch/features.txt"

          # A soft-dependency compile extracts the embedded AnyCPU SharpTS.dll.
          # Running eval proves this is a usable managed payload, not merely a
          # resource/copy assertion.
          mkdir "$scratch/softdep"
          "$native" --compile Examples/AotCompileGate/softdep.ts --ref-asm \
            -o "$scratch/softdep/softdep.dll"
          test -f "$scratch/softdep/SharpTS.dll"
          dotnet "$scratch/softdep/softdep.dll" > "$scratch/softdep.txt"
          grep -qx '42' "$scratch/softdep.txt"

          # fork needs a second compiler process and is deliberately absent from
          # the native SKU. Fail before writing a misleading output assembly.
          if "$native" --compile Examples/AotCompileGate/fork.ts \
              -o "$scratch/fork.dll" 2> "$scratch/fork-error.txt"; then
            echo "child_process.fork unexpectedly compiled under Native AOT"
            exit 1
          fi
          grep -Fq \
            'child_process.fork in compiled output is not available in the native SharpTS build' \
            "$scratch/fork-error.txt"
          test ! -f "$scratch/fork.dll"

          # Managed-only public boundaries must fail before their reflection/loader paths.
          if "$native" Examples/AotCompileGate/main.ts \
              -r "$PWD/artifacts/managed-runtime/SharpTS.dll" \
              > "$scratch/reference-error.txt" 2>&1; then
            echo "third-party reference loading unexpectedly ran under Native AOT"
            exit 1
          fi
          grep -Fq \
            'loading .NET reference assemblies is not available in the native SharpTS build' \
            "$scratch/reference-error.txt"

          if "$native" --gen-decl System.String \
              > "$scratch/gen-decl-error.txt" 2>&1; then
            echo "declaration discovery unexpectedly ran under Native AOT"
            exit 1
          fi
          grep -Fq -- \
            '--gen-decl is not available in the native SharpTS build' \
            "$scratch/gen-decl-error.txt"

          if "$native" --compile Examples/AotCompileGate/main.ts --verify \
              -o "$scratch/verify.dll" \
              > "$scratch/verify-error.txt" 2>&1; then
            echo "IL verification unexpectedly ran under Native AOT"
            exit 1
          fi
          grep -Fq -- \
            '--verify is not available in the native SharpTS build' \
            "$scratch/verify-error.txt"
          test ! -f "$scratch/verify.dll"

          # Exercise PE-Packer from inside SharpTS's partial-trim closure too.
          # The same empty DOTNET_ROOT used above also proves executable creation
          # comes from PE-Packer's embedded apphost rather than the runner's SDK.
          DOTNET_ROOT="$empty_dotnet_root" "$native" --compile \
            Examples/AotCompileGate/main.ts -t exe \
            -o "$scratch/modules"
          "$scratch/modules" > "$scratch/bundled.txt"
          diff -u "$scratch/interpreted.txt" "$scratch/bundled.txt"
