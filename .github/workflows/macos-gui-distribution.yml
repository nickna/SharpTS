name: macOS GUI distribution certification

on:
  workflow_dispatch:
    inputs:
      bundle_identifier:
        description: Immutable reverse-DNS bundle identifier
        required: true
        type: string
      display_name:
        description: Application display name
        required: true
        default: SharpTS GUI Preview
        type: string
      short_version:
        description: Three-part marketing version
        required: true
        type: string
      build_version:
        description: Numeric build version
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Build and execute the native candidate
        shell: pwsh
        run: SharpTS.Gui.Sdk.Consumer/Run-PackagedConsumer.ps1 -RuntimeIdentifier osx-arm64 -RealWindow

      - name: Stage reusable distribution input
        shell: pwsh
        run: |
          $publish = 'artifacts/macos-distribution-input/publish'
          New-Item -ItemType Directory -Path $publish -Force | Out-Null
          Copy-Item -Path 'artifacts/macos-preview/osx-arm64/published single file/*' -Destination $publish -Recurse -Force

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-gui-certification-payload
          path: artifacts/macos-distribution-input
          if-no-files-found: error

  sign-notarize:
    needs: build-candidate
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/reusable-macos-gui-distribution.yml
    with:
      payload_artifact: macos-gui-certification-payload
      executable: SharpTS.Gui.Sdk.Consumer
      bundle_identifier: ${{ inputs.bundle_identifier }}
      display_name: ${{ inputs.display_name }}
      short_version: ${{ inputs.short_version }}
      build_version: ${{ inputs.build_version }}
      architecture: arm64
    secrets: inherit
