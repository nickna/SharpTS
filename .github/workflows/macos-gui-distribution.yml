name: macOS GUI distribution

on:
  workflow_dispatch:
    inputs:
      bundle_identifier:
        description: Immutable reverse-DNS bundle identifier
        required: true
        type: string
      display_name:
        description: Application display name
        required: true
        default: SharpTS GUI Preview
        type: string
      short_version:
        description: Three-part marketing version
        required: true
        type: string
      build_version:
        description: Numeric build version
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  gui-sdk-candidate:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build and audit the exact GUI SDK candidate
        shell: pwsh
        run: SharpTS.Gui.Sdk.Consumer/Run-PackagedConsumer.ps1 -RuntimeIdentifier osx-arm64 -PackageOnly
      - uses: actions/upload-artifact@v4
        with:
          name: sharpts-gui-sdk-candidate
          path: artifacts/macos-preview/osx-arm64/feed/SharpTS.Gui.Sdk.0.3.0-preview.1.nupkg

  sign-notarize:
    needs: gui-sdk-candidate
    environment: macos-gui-distribution
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            architecture: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@v4
        with:
          name: sharpts-gui-sdk-candidate
          path: artifacts/macos-preview/candidate
      - name: Build and execute the native candidate
        shell: pwsh
        run: SharpTS.Gui.Sdk.Consumer/Run-PackagedConsumer.ps1 -RuntimeIdentifier ${{ matrix.rid }} -RealWindow -CandidatePackage artifacts/macos-preview/candidate/SharpTS.Gui.Sdk.0.3.0-preview.1.nupkg
      - name: Import Developer ID certificate and configure notarization
        shell: bash
        env:
          P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          test -n "$P12_BASE64" && test -n "$P12_PASSWORD"
          test -n "$NOTARY_KEY_BASE64" && test -n "$NOTARY_KEY_ID" && test -n "$NOTARY_ISSUER_ID"
          keychain="$RUNNER_TEMP/sharpts-signing.keychain-db"
          password="$(uuidgen)$(uuidgen)"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          xcrun notarytool store-credentials sharpts-gui-notary --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          printf 'SIGNING_KEYCHAIN=%s\n' "$keychain" >> "$GITHUB_ENV"
      - name: Sign, notarize, staple, and validate app and DMG
        shell: pwsh
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          BUNDLE_IDENTIFIER: ${{ inputs.bundle_identifier }}
          DISPLAY_NAME: ${{ inputs.display_name }}
          SHORT_VERSION: ${{ inputs.short_version }}
          BUILD_VERSION: ${{ inputs.build_version }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_IDENTITY)) {
            throw "The macos-gui-distribution environment must provide a Developer ID Application identity."
          }
          scripts/package-gui-macos.ps1 `
            -PublishDirectory "artifacts/macos-preview/${{ matrix.rid }}/published single file" `
            -OutputDirectory "artifacts/macos-distribution/${{ matrix.rid }}" `
            -BundleIdentifier $env:BUNDLE_IDENTIFIER `
            -DisplayName $env:DISPLAY_NAME `
            -ShortVersion $env:SHORT_VERSION `
            -BuildVersion $env:BUILD_VERSION `
            -Architecture ${{ matrix.architecture }} `
            -Executable SharpTS.Gui.Sdk.Consumer `
            -SigningIdentity $env:SIGNING_IDENTITY `
            -NotaryKeychainProfile sharpts-gui-notary `
            -CreateDmg `
            -RequireSigned `
            -RequireNotarized
      - name: Attest signed distribution provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/macos-distribution/${{ matrix.rid }}/*.zip
            artifacts/macos-distribution/${{ matrix.rid }}/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: signed-macos-gui-${{ matrix.architecture }}
          path: |
            artifacts/macos-distribution/${{ matrix.rid }}/*.zip
            artifacts/macos-distribution/${{ matrix.rid }}/*.dmg
            artifacts/macos-distribution/${{ matrix.rid }}/SHA256SUMS
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"
          if [[ -n "${SIGNING_KEYCHAIN:-}" && -f "$SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi
