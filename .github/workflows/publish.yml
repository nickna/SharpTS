name: Publish to NuGet

# Ordering is the release gate: build/pack runs first, then every managed and
# native artifact is published and smoke-tested, and only when all of them
# succeed does the final `release` job push to NuGet and create the GitHub
# Release with all twelve archives attached. A failing RID therefore blocks the
# release instead of leaving a silently missing asset behind an already-public
# package.
#
# workflow_dispatch is the dry-run mode: it exercises the full matrix (including
# the six native RIDs and their runner labels) without publishing anything —
# run it before the first real tag, and after runner-label or matrix changes.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # Tag pushes release the tag's version; dispatch dry runs stamp a version
      # that can never be mistaken for (or collide with) a real release.
      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF_NAME#v}
          else
            VERSION=0.0.0-dryrun.${GITHUB_RUN_NUMBER}
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "MinVerVersionOverride=$VERSION" >> "$GITHUB_ENV"

      - name: Stage release version into GUI artifacts
        shell: pwsh
        run: ./scripts/sync-gui-version.ps1 -Version "${{ steps.version.outputs.VERSION }}"

      - name: Verify staged GUI version projections
        shell: pwsh
        run: ./scripts/sync-gui-version.ps1 -Check -Version "${{ steps.version.outputs.VERSION }}"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Same exclusions as ci.yml: LiveNetwork tests make real outbound DNS/HTTP
      # calls and npm tests run a real `npm install`; both can false-red on runner
      # network hiccups — which here would block a tagged release after build but
      # before pack/push.
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal --filter "Category!=LiveNetwork&Category!=LoadSensitive&Category!=npm"

      - name: Test NuGet release helper
        shell: pwsh
        run: ./scripts/test-nuget-release.ps1

      - name: Publish SharpTS for SDK bundling
        run: dotnet publish SharpTS.csproj --configuration Release --no-build

      - name: Publish Windows GUI host payload
        run: dotnet publish SharpTS.Gui.Host/SharpTS.Gui.Host.csproj --configuration Release --self-contained false --no-build

      - name: Publish Windows GUI AOT host payload
        run: >-
          dotnet publish SharpTS.Gui.Host/SharpTS.Gui.Host.csproj
          --configuration Release
          --self-contained false
          --no-restore
          -p:SharpTSGuiHostLibrary=true
          -o SharpTS.Gui.Host/bin/Release/net10.0/aot-publish

      - name: Verify SDK dependencies exist
        run: |
          echo "Checking SDK package dependencies..."
          test -f "SharpTS.Sdk.Tasks/bin/Release/net10.0/SharpTS.Sdk.Tasks.dll" || { echo "❌ Tasks.dll not found"; exit 1; }
          test -d "bin/Release/net10.0/publish" || { echo "❌ Publish directory not found"; exit 1; }
          echo "✓ All SDK dependencies found"

      - name: Pack packages
        run: dotnet pack --no-build --configuration Release -p:MinVerVersionOverride=${{ steps.version.outputs.VERSION }} --output ./nupkg

      - name: Verify packages created
        run: |
          echo "Packages created:"
          ls -lh ./nupkg/
          test -f "./nupkg/SharpTS.${{ steps.version.outputs.VERSION }}.nupkg" || { echo "❌ SharpTS package not found"; exit 1; }
          test -f "./nupkg/SharpTS.Sdk.${{ steps.version.outputs.VERSION }}.nupkg" || { echo "❌ SharpTS.Sdk package not found"; exit 1; }
          test -f "./nupkg/SharpTS.Hosting.${{ steps.version.outputs.VERSION }}.nupkg" || { echo "❌ SharpTS.Hosting package not found"; exit 1; }
          test -f "./nupkg/SharpTS.LanguageServer.${{ steps.version.outputs.VERSION }}.nupkg" || { echo "❌ SharpTS.LanguageServer package not found"; exit 1; }
          test -f "./nupkg/SharpTS.Gui.Sdk.${{ steps.version.outputs.VERSION }}.nupkg" || { echo "❌ SharpTS.Gui.Sdk package not found"; exit 1; }
          echo "✓ All packages created successfully"

      - name: Audit tagged GUI SDK package
        shell: pwsh
        run: >-
          ./SharpTS.Gui.Sdk.Consumer/Run-PackagedConsumer.ps1
          -CandidatePackage "./nupkg/SharpTS.Gui.Sdk.${{ steps.version.outputs.VERSION }}.nupkg"
          -PackageVersion "${{ steps.version.outputs.VERSION }}"
          -PackageOnly

      # A new package ID must be onboarded under the Trusted Publishing policy's
      # NuGet owner before a tag can publish it. This also keeps every package
      # artifact tied to a package ID that NuGet already serves.
      - name: Preflight NuGet package IDs and artifacts
        shell: pwsh
        run: >-
          ./scripts/nuget-release.ps1
          -Action Preflight
          -Version "${{ steps.version.outputs.VERSION }}"
          -PackageDirectory ./nupkg

      - name: Smoke test packaged SDK
        shell: pwsh
        run: >-
          ./scripts/test-packaged-sdk.ps1
          -PackagePath "./nupkg/SharpTS.Sdk.${{ steps.version.outputs.VERSION }}.nupkg"
          -PackageVersion "${{ steps.version.outputs.VERSION }}"

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nupkg
          path: ./nupkg/*.nupkg
          if-no-files-found: error
          retention-days: 7

  # Managed SKU (#1324 Track 0): self-contained single-file binaries per RID,
  # attached to the GitHub Release. No .NET install required on the target
  # machine; full feature set (interop, -r, --verify, --gen-decl). When the
  # managed self-contained CLI handles child_process.fork it launches its own
  # Environment.ProcessPath, so the child does not require a separate SDK.
  #
  # Runner selection: self-contained *managed* publishing is cross-RID capable,
  # but four RIDs run on their own architecture so the published binary is
  # executed before release (win/linux on x64 and arm64 runners). macOS
  # binaries are cross-published (macOS runner minutes bill at 10x); the SDK
  # ad-hoc-signs single-file Mach-O bundles during publish, but if Gatekeeper
  # still rejects a downloaded binary, `codesign -s - sharpts` re-signs it.
  binaries:
    name: Managed SKU (${{ matrix.rid }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MinVerVersionOverride: ${{ needs.build.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-2025,           smoke: true }
          - { rid: win-arm64,   os: windows-11-vs2026-arm,    smoke: true }
          - { rid: linux-x64,   os: ubuntu-24.04,            smoke: true }
          - { rid: linux-arm64, os: ubuntu-24.04-arm,         smoke: true }
          - { rid: osx-arm64,   os: ubuntu-24.04,            smoke: false }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # IncludeAllContentForSelfExtract (not just native libs): several managed-SKU
      # features need real files on disk behind Assembly.Location — --verify
      # (ILVerifier resolves the BCL from typeof(object).Assembly.Location, fails
      # with "Assembly or module not found: System.Runtime" under in-bundle
      # loading) and soft-dep SharpTS.dll co-location after --compile
      # (Program.cs CopySharpTSRuntimeIfNeeded). Full extraction restores both;
      # the cache under %TEMP%/.net is written once on first run.
      #
      # PlatformTarget=AnyCPU: a RID publish otherwise infers PlatformTarget=x64/
      # arm64, arch-stamping every managed assembly — including the SharpTS.dll
      # that gets co-located next to compiled soft-dep output, which then fails to
      # load ("SharpTS runtime not present") when that output runs on a different
      # architecture's dotnet (e.g. x64 SKU under emulation on an arm64 machine).
      # Only the apphost needs to be RID-specific; keep the IL arch-neutral.
      - name: Publish self-contained single-file
        shell: bash
        run: |
          dotnet publish SharpTS.csproj --configuration Release \
            -r ${{ matrix.rid }} --self-contained \
            -p:PublishSingleFile=true \
            -p:IncludeAllContentForSelfExtract=true \
            -p:PlatformTarget=AnyCPU \
            -p:Version=${{ needs.build.outputs.version }} \
            -o ./sku/${{ matrix.rid }}

      # Embedded-resource smoke: the interpreter and compiler both depend on
      # resources bundled into the single-file exe (stdlib/*.ts via
      # EmbeddedStdlibProvider, lib.*.d.ts via TypeScriptLibProvider). Run the
      # actual published binary over a stdlib-importing program in both modes,
      # and run the compiled output under the runner's JIT.
      - name: Smoke test published binary
        if: matrix.smoke
        shell: bash
        run: |
          cat > smoke.ts <<'EOF'
          import * as path from "node:path";
          const joined = path.join("alpha", "beta", "gamma.txt");
          console.log(joined.split(path.sep).join("|"));
          const sum: number = [1, 2, 3, 4].map((x) => x * 2).reduce((a, b) => a + b, 0);
          console.log(`sum=${sum}`);
          EOF
          expected=$'alpha|beta|gamma.txt\nsum=20'
          exe=./sku/${{ matrix.rid }}/SharpTS
          [ -f "$exe.exe" ] && exe="$exe.exe"
          # tr -d '\r': Windows console output is CRLF; normalize for the compare.
          actual=$("$exe" smoke.ts | tr -d '\r')
          [ "$actual" = "$expected" ] || { echo "interpret output mismatch:"; echo "$actual"; exit 1; }
          "$exe" --compile smoke.ts -o smoke-out.dll --verify
          actual=$(dotnet smoke-out.dll | tr -d '\r')
          [ "$actual" = "$expected" ] || { echo "compiled output mismatch:"; echo "$actual"; exit 1; }
          # Soft-dep path: eval() makes the compiler co-locate SharpTS.dll from
          # the single-file extraction cache; the output must find it at runtime.
          echo 'console.log(eval("6 * 7"));' > softdep.ts
          mkdir softdep-out
          "$exe" --compile softdep.ts -o softdep-out/softdep.dll
          actual=$(dotnet softdep-out/softdep.dll | tr -d '\r')
          [ "$actual" = "42" ] || { echo "soft-dep output mismatch:"; echo "$actual"; exit 1; }
          echo "✓ smoke passed (interpret + compile + --verify + soft-dep co-locate)"

      # The binary keeps assembly identity "SharpTS" (a reflection contract:
      # compiled DLLs late-bind via Type.GetType("…, SharpTS")) — only the
      # file on disk is renamed to the familiar CLI name.
      - name: Package archive
        shell: bash
        run: |
          VERSION=${{ needs.build.outputs.version }}
          RID=${{ matrix.rid }}
          mkdir staging
          cp LICENSE README.md staging/
          case "$RID" in
            win-*)
              cp ./sku/$RID/SharpTS.exe staging/sharpts.exe
              # zip on ubuntu runners (cross-publish), 7z on windows.
              if command -v zip >/dev/null 2>&1; then
                (cd staging && zip -r ../sharpts-$VERSION-$RID.zip .)
              else
                (cd staging && 7z a ../sharpts-$VERSION-$RID.zip .)
              fi
              ;;
            *)
              cp ./sku/$RID/SharpTS staging/sharpts
              chmod +x staging/sharpts
              tar -C staging -czf sharpts-$VERSION-$RID.tar.gz .
              ;;
          esac

      - name: Upload archive artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: managed-${{ matrix.rid }}
          path: sharpts-${{ needs.build.outputs.version }}-${{ matrix.rid }}.*
          if-no-files-found: error
          retention-days: 7

  # Native SKU (#1324 Phase 3): a true Native AOT compiler/interpreter for the
  # frozen straight-TypeScript surface. Each RID runs on its own architecture so
  # every uploaded artifact is executed, not merely cross-compiled. The managed
  # AnyCPU payload is built first and embedded for compiled eval/Proxy/Intl/vm/
  # worker soft dependencies; compiled output still runs under CoreCLR.
  native-binaries:
    name: Native SKU (${{ matrix.rid }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MinVerVersionOverride: ${{ needs.build.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-2025 }
          - { rid: win-arm64,   os: windows-11-vs2026-arm }
          - { rid: linux-x64,   os: ubuntu-24.04 }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: osx-arm64,   os: macos-15 }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install Native AOT prerequisites
        if: startsWith(matrix.rid, 'linux-')
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # Two-stage build: an assembly cannot embed itself while it is being
      # compiled. Keep this payload AnyCPU so a compiled output can move between
      # architectures supported by its installed CoreCLR.
      - name: Build managed runtime payload
        shell: bash
        run: |
          dotnet publish SharpTS.csproj --configuration Release \
            -p:PlatformTarget=AnyCPU \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:Version=${{ needs.build.outputs.version }} \
            -o ./sku/managed-runtime

      # The mandatory Native AOT metadata properties (TrimMode, IlcTrimMetadata,
      # IlcGenerateCompleteTypeMetadata, StackTraceSupport) live in SharpTS.csproj
      # behind PublishAot=true — a local `dotnet publish -p:PublishAot=true` gets
      # the same working configuration as CI.
      - name: Publish Native AOT binary
        shell: bash
        run: |
          set -o pipefail
          dotnet publish SharpTS.csproj --configuration Release \
            -r ${{ matrix.rid }} \
            -p:PublishAot=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:Version=${{ needs.build.outputs.version }} \
            -p:SharpTSManagedRuntimePayloadPath="$PWD/sku/managed-runtime/SharpTS.dll" \
            -o ./sku/${{ matrix.rid }} 2>&1 | tee native-publish-${{ matrix.rid }}.log

      # ILC closures differ per RID; a SharpTS-owned warning that only appears on
      # one platform must fail that platform's release job, not ship silently.
      # External diagnostics remain informational exactly as in ci.yml.
      - name: Enforce Native AOT publish warning inventory
        shell: pwsh
        run: |
          ./scripts/aot-publish-warning-report.ps1 `
            -LogPath native-publish-${{ matrix.rid }}.log `
            -SummaryPath native-publish-warning-summary-${{ matrix.rid }}.json `
            -EnforceBaseline

      - name: Smoke test native binary
        shell: bash
        run: |
          set -euo pipefail
          rid=${{ matrix.rid }}
          native="$PWD/sku/$rid/SharpTS"
          [ -f "$native.exe" ] && native="$native.exe"
          scratch="$(mktemp -d)"

          # Interpreter + embedded stdlib/lib.d.ts resources. tr -d '\r':
          # Windows console output is CRLF, which breaks grep -qx exact-line
          # matches and would make every capture differ from the POSIX RIDs.
          "$native" Examples/AotCompileGate/main.ts | tr -d '\r' > "$scratch/interpreted.txt"
          grep -qx '42' "$scratch/interpreted.txt"

          # An empty DOTNET_ROOT proves compile-time reference rewriting does not
          # borrow an installed reference pack.
          empty_dotnet_root="$(mktemp -d)"
          DOTNET_ROOT="$empty_dotnet_root" "$native" --compile \
            Examples/AotCompileGate/main.ts --ref-asm -o "$scratch/modules.dll"
          dotnet "$scratch/modules.dll" | tr -d '\r' > "$scratch/modules.txt"
          diff -u "$scratch/interpreted.txt" "$scratch/modules.txt"

          # Accessors, generators and generic shapes exercise raw custom-attribute
          # blobs plus the TypeBuilderInstantiation and MethodBuilderInstantiation
          # emit fallbacks on this RID's ILC closure.
          "$native" --compile Examples/AotCompileGate/features.ts --ref-asm \
            -o "$scratch/features.dll"
          dotnet "$scratch/features.dll" | tr -d '\r' > "$scratch/features.txt"
          grep -qx '2 2 33 7 11' "$scratch/features.txt"

          # Prove the embedded AnyCPU managed runtime is extractable and usable.
          mkdir "$scratch/softdep"
          "$native" --compile Examples/AotCompileGate/softdep.ts --ref-asm \
            -o "$scratch/softdep/softdep.dll"
          test -f "$scratch/softdep/SharpTS.dll"
          dotnet "$scratch/softdep/softdep.dll" | tr -d '\r' > "$scratch/softdep.txt"
          grep -qx '42' "$scratch/softdep.txt"

          # The Managed-SKU-only boundaries must refuse identically on every RID —
          # same assertions as ci.yml's linux-x64 gate.
          if "$native" --compile Examples/AotCompileGate/fork.ts \
              -o "$scratch/fork.dll" 2> "$scratch/fork-error.txt"; then
            echo "child_process.fork unexpectedly compiled under Native AOT"
            exit 1
          fi
          bash scripts/assert-managed-build-required.sh \
            "$scratch/fork-error.txt" 'child_process.fork'
          test ! -f "$scratch/fork.dll"

          if "$native" Examples/AotCompileGate/main.ts \
              -r "$PWD/sku/managed-runtime/SharpTS.dll" \
              > "$scratch/reference-error.txt" 2>&1; then
            echo "third-party reference loading unexpectedly ran under Native AOT"
            exit 1
          fi
          bash scripts/assert-managed-build-required.sh \
            "$scratch/reference-error.txt" 'loading .NET reference assemblies'

          "$native" Examples/AotCompileGate/dotnet-interop.ts \
            | tr -d '\r' > "$scratch/dotnet-interop.txt"
          grep -qx 'native-dotnet-42' "$scratch/dotnet-interop.txt"
          "$native" --compile Examples/AotCompileGate/dotnet-interop.ts --ref-asm \
            -o "$scratch/dotnet-interop.dll"
          dotnet "$scratch/dotnet-interop.dll" | tr -d '\r' \
            > "$scratch/dotnet-interop-compiled.txt"
          diff -u "$scratch/dotnet-interop.txt" "$scratch/dotnet-interop-compiled.txt"

          if "$native" Examples/AotCompileGate/dotnet-interop-unknown.ts \
              > "$scratch/dotnet-interop-error.txt" 2>&1; then
            echo "an unregistered .NET type unexpectedly ran under Native AOT"
            exit 1
          fi
          grep -Fq 'not present in this native SharpTS catalog' \
            "$scratch/dotnet-interop-error.txt"

          if "$native" --gen-decl System.String \
              > "$scratch/gen-decl-error.txt" 2>&1; then
            echo "declaration discovery unexpectedly ran under Native AOT"
            exit 1
          fi
          bash scripts/assert-managed-build-required.sh \
            "$scratch/gen-decl-error.txt" '--gen-decl'

          if "$native" --compile Examples/AotCompileGate/main.ts --verify \
              -o "$scratch/verify.dll" \
              > "$scratch/verify-error.txt" 2>&1; then
            echo "IL verification unexpectedly ran under Native AOT"
            exit 1
          fi
          bash scripts/assert-managed-build-required.sh \
            "$scratch/verify-error.txt" '--verify'
          test ! -f "$scratch/verify.dll"

          case "$rid" in
            osx-*)
              # The built-in bundler intentionally refuses unsigned/unadjusted
              # Mach-O output; keep that loss explicit in the native SKU.
              if "$native" --compile Examples/AotCompileGate/main.ts -t exe \
                  -o "$scratch/bundled" 2> "$scratch/bundle-error.txt"; then
                echo "built-in macOS bundle unexpectedly succeeded"
                exit 1
              fi
              grep -Fq 'cannot target' "$scratch/bundle-error.txt"
              ;;
            *)
              # PE-Packer's embedded apphost must make bundle creation SDK-free.
              DOTNET_ROOT="$empty_dotnet_root" "$native" --compile \
                Examples/AotCompileGate/main.ts -t exe -o "$scratch/bundled"
              [ -f "$scratch/bundled.exe" ] && bundled="$scratch/bundled.exe" \
                || bundled="$scratch/bundled"
              "$bundled" | tr -d '\r' > "$scratch/bundled.txt"
              diff -u "$scratch/interpreted.txt" "$scratch/bundled.txt"
              ;;
          esac

      - name: Package archive
        shell: bash
        run: |
          VERSION=${{ needs.build.outputs.version }}
          RID=${{ matrix.rid }}
          mkdir staging
          cp LICENSE README.md staging/
          case "$RID" in
            win-*)
              cp "./sku/$RID/SharpTS.exe" staging/sharpts.exe
              if command -v zip >/dev/null 2>&1; then
                (cd staging && zip -r "../sharpts-native-$VERSION-$RID.zip" .)
              else
                (cd staging && 7z a "../sharpts-native-$VERSION-$RID.zip" .)
              fi
              ;;
            *)
              cp "./sku/$RID/SharpTS" staging/sharpts
              chmod +x staging/sharpts
              tar -C staging -czf "sharpts-native-$VERSION-$RID.tar.gz" .
              ;;
          esac

      - name: Upload archive artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-${{ matrix.rid }}
          path: sharpts-native-${{ needs.build.outputs.version }}-${{ matrix.rid }}.*
          if-no-files-found: error
          retention-days: 7

      - name: Upload publish diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Not "native-<rid>": the release job downloads '{managed,native}-*'
          # as release assets, and diagnostics must not ship in the release.
          name: diagnostics-native-${{ matrix.rid }}
          if-no-files-found: ignore
          path: |
            native-publish-${{ matrix.rid }}.log
            native-publish-warning-summary-${{ matrix.rid }}.json
          retention-days: 7

  # Runs only for real tags, and only after every managed and native artifact
  # has been built and smoke-tested. This is the single publish point: NuGet
  # push plus the GitHub Release with all archives attached.
  release:
    needs: [build, binaries, native-binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: nuget-release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nupkg
          path: ./nupkg

      - name: Download managed archive artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: 'managed-*'
          path: ./assets
          merge-multiple: true

      - name: Download native archive artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: 'native-*'
          path: ./assets
          merge-multiple: true

      # Exchange this job's environment-bound GitHub OIDC token for a one-hour
      # NuGet API key. The matching nuget.org policy is restricted to
      # nickna/SharpTS, publish.yml, and the nuget-release environment.
      - name: Authenticate to NuGet with trusted publishing
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: nbn

      - name: Push and verify NuGet packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: >-
          ./scripts/nuget-release.ps1
          -Action Publish
          -Version "${{ needs.build.outputs.version }}"
          -PackageDirectory ./nupkg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          files: |
            ./nupkg/SharpTS.${{ needs.build.outputs.version }}.nupkg
            ./nupkg/SharpTS.Hosting.${{ needs.build.outputs.version }}.nupkg
            ./nupkg/SharpTS.LanguageServer.${{ needs.build.outputs.version }}.nupkg
            ./nupkg/SharpTS.Sdk.${{ needs.build.outputs.version }}.nupkg
            ./nupkg/SharpTS.Gui.Sdk.${{ needs.build.outputs.version }}.nupkg
            ./assets/*
