name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Same exclusion as ci.yml: LiveNetwork tests make real outbound DNS/HTTP
      # calls and can false-red on runner network hiccups — which here would block
      # a tagged release after build but before pack/push.
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal --filter "Category!=LiveNetwork&Category!=LoadSensitive"

      - name: Publish SharpTS for SDK bundling
        run: dotnet publish SharpTS.csproj --configuration Release --no-build

      - name: Verify SDK dependencies exist
        run: |
          echo "Checking SDK package dependencies..."
          test -f "SharpTS.Sdk.Tasks/bin/Release/net10.0/SharpTS.Sdk.Tasks.dll" || { echo "❌ Tasks.dll not found"; exit 1; }
          test -d "bin/Release/net10.0/publish" || { echo "❌ Publish directory not found"; exit 1; }
          echo "✓ All SDK dependencies found"

      - name: Pack packages
        run: dotnet pack --no-build --configuration Release -p:Version=${{ steps.version.outputs.VERSION }} --output ./nupkg

      - name: Verify packages created
        run: |
          echo "Packages created:"
          ls -lh ./nupkg/
          test -f "./nupkg/SharpTS.${{ steps.version.outputs.VERSION }}.nupkg" || { echo "❌ SharpTS package not found"; exit 1; }
          test -f "./nupkg/SharpTS.Sdk.${{ steps.version.outputs.VERSION }}.nupkg" || { echo "❌ SharpTS.Sdk package not found"; exit 1; }
          test -f "./nupkg/SharpTS.LanguageServer.${{ steps.version.outputs.VERSION }}.nupkg" || { echo "❌ SharpTS.LanguageServer package not found"; exit 1; }
          echo "✓ All packages created successfully"

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ./nupkg/*

  # Managed SKU (#1324 Track 0): self-contained single-file binaries per RID,
  # attached to the GitHub Release. No .NET install required on the target
  # machine; full feature set (interop, -r, --verify, --gen-decl). Exception:
  # child_process.fork still shells `dotnet exec SharpTS.dll` and so needs an
  # installed .NET until Phase 1 moves it to Environment.ProcessPath.
  #
  # Runner selection: self-contained *managed* publishing is cross-RID capable,
  # so everything could build on ubuntu — win-x64 gets a windows runner (and
  # linux-x64 stays native on ubuntu) purely so the two most common RIDs are
  # smoke-tested against the actual published binary before upload. macOS
  # binaries are cross-published (macOS runner minutes bill at 10x); the SDK
  # ad-hoc-signs single-file Mach-O bundles during publish, but if Gatekeeper
  # still rejects a downloaded binary, `codesign -s - sharpts` re-signs it.
  binaries:
    name: Managed SKU (${{ matrix.rid }})
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest, smoke: true }
          - { rid: win-arm64,   os: ubuntu-latest,  smoke: false }
          - { rid: linux-x64,   os: ubuntu-latest,  smoke: true }
          - { rid: linux-arm64, os: ubuntu-latest,  smoke: false }
          - { rid: osx-x64,     os: ubuntu-latest,  smoke: false }
          - { rid: osx-arm64,   os: ubuntu-latest,  smoke: false }

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # IncludeAllContentForSelfExtract (not just native libs): several managed-SKU
      # features need real files on disk behind Assembly.Location — --verify
      # (ILVerifier resolves the BCL from typeof(object).Assembly.Location, fails
      # with "Assembly or module not found: System.Runtime" under in-bundle
      # loading) and soft-dep SharpTS.dll co-location after --compile
      # (Program.cs CopySharpTSRuntimeIfNeeded). Full extraction restores both;
      # the cache under %TEMP%/.net is written once on first run.
      #
      # PlatformTarget=AnyCPU: a RID publish otherwise infers PlatformTarget=x64/
      # arm64, arch-stamping every managed assembly — including the SharpTS.dll
      # that gets co-located next to compiled soft-dep output, which then fails to
      # load ("SharpTS runtime not present") when that output runs on a different
      # architecture's dotnet (e.g. x64 SKU under emulation on an arm64 machine).
      # Only the apphost needs to be RID-specific; keep the IL arch-neutral.
      - name: Publish self-contained single-file
        shell: bash
        run: |
          dotnet publish SharpTS.csproj --configuration Release \
            -r ${{ matrix.rid }} --self-contained \
            -p:PublishSingleFile=true \
            -p:IncludeAllContentForSelfExtract=true \
            -p:PlatformTarget=AnyCPU \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            -o ./sku/${{ matrix.rid }}

      # Embedded-resource smoke: the interpreter and compiler both depend on
      # resources bundled into the single-file exe (stdlib/*.ts via
      # EmbeddedStdlibProvider, lib.*.d.ts via TypeScriptLibProvider). Run the
      # actual published binary over a stdlib-importing program in both modes,
      # and run the compiled output under the runner's JIT.
      - name: Smoke test published binary
        if: matrix.smoke
        shell: bash
        run: |
          cat > smoke.ts <<'EOF'
          import * as path from "node:path";
          const joined = path.join("alpha", "beta", "gamma.txt");
          console.log(joined.split(path.sep).join("|"));
          const sum: number = [1, 2, 3, 4].map((x) => x * 2).reduce((a, b) => a + b, 0);
          console.log(`sum=${sum}`);
          EOF
          expected=$'alpha|beta|gamma.txt\nsum=20'
          exe=./sku/${{ matrix.rid }}/SharpTS
          [ -f "$exe.exe" ] && exe="$exe.exe"
          # tr -d '\r': Windows console output is CRLF; normalize for the compare.
          actual=$("$exe" smoke.ts | tr -d '\r')
          [ "$actual" = "$expected" ] || { echo "interpret output mismatch:"; echo "$actual"; exit 1; }
          "$exe" --compile smoke.ts -o smoke-out.dll --verify
          actual=$(dotnet smoke-out.dll | tr -d '\r')
          [ "$actual" = "$expected" ] || { echo "compiled output mismatch:"; echo "$actual"; exit 1; }
          # Soft-dep path: eval() makes the compiler co-locate SharpTS.dll from
          # the single-file extraction cache; the output must find it at runtime.
          echo 'console.log(eval("6 * 7"));' > softdep.ts
          mkdir softdep-out
          "$exe" --compile softdep.ts -o softdep-out/softdep.dll
          actual=$(dotnet softdep-out/softdep.dll | tr -d '\r')
          [ "$actual" = "42" ] || { echo "soft-dep output mismatch:"; echo "$actual"; exit 1; }
          echo "✓ smoke passed (interpret + compile + --verify + soft-dep co-locate)"

      # The binary keeps assembly identity "SharpTS" (a reflection contract:
      # compiled DLLs late-bind via Type.GetType("…, SharpTS")) — only the
      # file on disk is renamed to the familiar CLI name.
      - name: Package archive
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          RID=${{ matrix.rid }}
          mkdir staging
          cp LICENSE README.md staging/
          case "$RID" in
            win-*)
              cp ./sku/$RID/SharpTS.exe staging/sharpts.exe
              # zip on ubuntu runners (win-arm64 cross-publish), 7z on windows.
              if command -v zip >/dev/null 2>&1; then
                (cd staging && zip -r ../sharpts-$VERSION-$RID.zip .)
              else
                (cd staging && 7z a ../sharpts-$VERSION-$RID.zip .)
              fi
              ;;
            *)
              cp ./sku/$RID/SharpTS staging/sharpts
              chmod +x staging/sharpts
              tar -C staging -czf sharpts-$VERSION-$RID.tar.gz .
              ;;
          esac

      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" sharpts-${{ steps.version.outputs.VERSION }}-${{ matrix.rid }}.* --clobber

  # Native SKU (#1324 Phase 3): a true Native AOT compiler/interpreter for the
  # frozen straight-TypeScript surface. Each RID runs on its own architecture so
  # every uploaded artifact is executed, not merely cross-compiled. The managed
  # AnyCPU payload is built first and embedded for compiled eval/Proxy/Intl/vm/
  # worker soft dependencies; compiled output still runs under CoreCLR.
  native-binaries:
    name: Native SKU (${{ matrix.rid }})
    needs: publish
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest }
          - { rid: win-arm64,   os: windows-11-vs2026-arm }
          - { rid: linux-x64,   os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: osx-x64,     os: macos-15-intel }
          - { rid: osx-arm64,   os: macos-latest }

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install Native AOT prerequisites
        if: startsWith(matrix.rid, 'linux-')
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # Two-stage build: an assembly cannot embed itself while it is being
      # compiled. Keep this payload AnyCPU so a compiled output can move between
      # architectures supported by its installed CoreCLR.
      - name: Build managed runtime payload
        shell: bash
        run: |
          dotnet publish SharpTS.csproj --configuration Release \
            -p:PlatformTarget=AnyCPU \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            -o ./sku/managed-runtime

      - name: Publish Native AOT binary
        shell: bash
        run: |
          dotnet publish SharpTS.csproj --configuration Release \
            -r ${{ matrix.rid }} \
            -p:PublishAot=true \
            -p:TrimMode=partial \
            -p:IlcTrimMetadata=false \
            -p:IlcGenerateCompleteTypeMetadata=true \
            -p:StackTraceSupport=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            -p:SharpTSManagedRuntimePayloadPath="$PWD/sku/managed-runtime/SharpTS.dll" \
            -o ./sku/${{ matrix.rid }}

      - name: Smoke test native binary
        shell: bash
        run: |
          set -euo pipefail
          rid=${{ matrix.rid }}
          native="$PWD/sku/$rid/SharpTS"
          [ -f "$native.exe" ] && native="$native.exe"
          scratch="$(mktemp -d)"

          # Interpreter + embedded stdlib/lib.d.ts resources.
          "$native" Examples/AotCompileGate/main.ts > "$scratch/interpreted.txt"
          grep -qx '42' "$scratch/interpreted.txt"

          # An empty DOTNET_ROOT proves compile-time reference rewriting does not
          # borrow an installed reference pack.
          empty_dotnet_root="$(mktemp -d)"
          DOTNET_ROOT="$empty_dotnet_root" "$native" --compile \
            Examples/AotCompileGate/main.ts --ref-asm -o "$scratch/modules.dll"
          dotnet "$scratch/modules.dll" > "$scratch/modules.txt"
          diff -u "$scratch/interpreted.txt" "$scratch/modules.txt"

          # Prove the embedded AnyCPU managed runtime is extractable and usable.
          mkdir "$scratch/softdep"
          "$native" --compile Examples/AotCompileGate/softdep.ts --ref-asm \
            -o "$scratch/softdep/softdep.dll"
          test -f "$scratch/softdep/SharpTS.dll"
          dotnet "$scratch/softdep/softdep.dll" > "$scratch/softdep.txt"
          grep -qx '42' "$scratch/softdep.txt"

          case "$rid" in
            osx-*)
              # The built-in bundler intentionally refuses unsigned/unadjusted
              # Mach-O output; keep that loss explicit in the native SKU.
              if "$native" --compile Examples/AotCompileGate/main.ts -t exe \
                  -o "$scratch/bundled" 2> "$scratch/bundle-error.txt"; then
                echo "built-in macOS bundle unexpectedly succeeded"
                exit 1
              fi
              grep -Fq 'cannot target' "$scratch/bundle-error.txt"
              ;;
            *)
              # PE-Packer's embedded apphost must make bundle creation SDK-free.
              DOTNET_ROOT="$empty_dotnet_root" "$native" --compile \
                Examples/AotCompileGate/main.ts -t exe -o "$scratch/bundled"
              [ -f "$scratch/bundled.exe" ] && bundled="$scratch/bundled.exe" \
                || bundled="$scratch/bundled"
              "$bundled" > "$scratch/bundled.txt"
              diff -u "$scratch/interpreted.txt" "$scratch/bundled.txt"
              ;;
          esac

      - name: Package archive
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          RID=${{ matrix.rid }}
          mkdir staging
          cp LICENSE README.md staging/
          case "$RID" in
            win-*)
              cp "./sku/$RID/SharpTS.exe" staging/sharpts.exe
              if command -v zip >/dev/null 2>&1; then
                (cd staging && zip -r "../sharpts-native-$VERSION-$RID.zip" .)
              else
                (cd staging && 7z a "../sharpts-native-$VERSION-$RID.zip" .)
              fi
              ;;
            *)
              cp "./sku/$RID/SharpTS" staging/sharpts
              chmod +x staging/sharpts
              tar -C staging -czf "sharpts-native-$VERSION-$RID.tar.gz" .
              ;;
          esac

      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" sharpts-native-${{ steps.version.outputs.VERSION }}-${{ matrix.rid }}.* --clobber
