name: Examples

# The samples/ showcase has zero automated coverage otherwise — a broken flagship
# example is a first-impression bug. Manual trigger only (the harness runs every
# example end-to-end, which is too slow and too network-adjacent for every push).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        default: 'interpreted'
        type: choice
        options: [interpreted, dll, exe, all]

permissions:
  contents: read

jobs:
  examples:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build (Release)
        run: dotnet build src/SharpTS/SharpTS.csproj --configuration Release

      - name: Run examples
        shell: pwsh
        run: ./samples/test-examples.ps1 -Mode ${{ inputs.mode || 'interpreted' }}
