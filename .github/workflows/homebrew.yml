name: Update Homebrew tap

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: homebrew-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      !github.event.release.prerelease && !github.event.release.draft &&
      vars.HOMEBREW_TAP_READY == 'true' && vars.MACOS_CLI_SIGNING_ENABLED == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Require a stable version tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Homebrew updates require a stable vMAJOR.MINOR.PATCH tag.'
          }
          "version=$($env:RELEASE_TAG.Substring(1))" >> $env:GITHUB_OUTPUT
      - name: Download published Apple Silicon archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release download "$RELEASE_TAG" --repo nickna/SharpTS --dir archives \
            --pattern "sharpts-$VERSION-osx-arm64.tar.gz" \
            --pattern "sharpts-native-$VERSION-osx-arm64.tar.gz"
      - name: Execute and assess the published signed archives
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/test-cli-release-archive.ps1 -ArchivePath "archives/sharpts-$($env:VERSION)-osx-arm64.tar.gz" `
            -Version $env:VERSION -Sku Managed -RequireSigned -ResultsDirectory ./managed-validation
          ./scripts/test-cli-release-archive.ps1 -ArchivePath "archives/sharpts-native-$($env:VERSION)-osx-arm64.tar.gz" `
            -Version $env:VERSION -Sku Native -RequireSigned -ResultsDirectory ./native-validation
          ./scripts/generate-homebrew-casks.ps1 -Version $env:VERSION `
            -ManagedArchive "archives/sharpts-$($env:VERSION)-osx-arm64.tar.gz" `
            -NativeArchive "archives/sharpts-native-$($env:VERSION)-osx-arm64.tar.gz" -OutputDirectory ./generated
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: homebrew-casks
          path: generated/Casks/*.rb
          if-no-files-found: error
          retention-days: 7

  update:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: homebrew-release
    steps:
      - name: Require restricted tap token
        shell: bash
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: test -n "$TAP_TOKEN"
      # Use a fine-grained PAT restricted to Contents and Pull Requests on the tap.
      # The SharpTS GITHUB_TOKEN is never used for cross-repository writes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nickna/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          persist-credentials: true
      - name: Require published initial casks
        shell: bash
        run: test -f Casks/sharpts.rb && test -f Casks/sharpts-native.rb
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: homebrew-casks
          path: Casks
      - name: Open tested update PR and enable auto-merge
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Casks/sharpts.rb Casks/sharpts-native.rb; then exit 0; fi
          branch="codex/sharpts-v$VERSION"
          git switch -c "$branch"
          git config user.name 'SharpTS release automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Casks/sharpts.rb Casks/sharpts-native.rb
          git commit -m "Update SharpTS casks to $VERSION"
          git push origin "$branch"
          cat > "$RUNNER_TEMP/pr-body.md" <<'EOF'
          Update both Apple Silicon casks from the published stable release assets.

          Both exact archives passed interpretation, supported compilation, signature, and Gatekeeper checks before hash generation. Auto-merge waits for the tap's required cask checks.
          EOF
          pr=$(gh pr create --repo nickna/homebrew-tap --head "$branch" \
            --title "Update SharpTS casks to $VERSION" --body-file "$RUNNER_TEMP/pr-body.md")
          # Require both configured cask checks to exist before permitting merge.
          checks='[]'
          for attempt in $(seq 1 20); do
            checks=$(gh pr checks --repo nickna/homebrew-tap "$pr" --required --json name,bucket || true)
            if jq -e 'map(.name) | index("Apple Silicon (sharpts)") != null and index("Apple Silicon (sharpts-native)") != null' <<< "$checks" >/dev/null; then break; fi
            sleep 15
          done
          jq -e 'map(.name) | index("Apple Silicon (sharpts)") != null and index("Apple Silicon (sharpts-native)") != null' <<< "$checks" >/dev/null
          gh pr checks --repo nickna/homebrew-tap "$pr" --required --watch --fail-fast --interval 30
          gh pr merge --repo nickna/homebrew-tap "$pr" --auto --squash
