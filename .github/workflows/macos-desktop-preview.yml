name: macOS desktop preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Execution/**"
      - "Hosting/**"
      - "Compilation/**"
      - "Cli/**"
      - "SharpTS.Gui/**"
      - "SharpTS.Gui.Host/**"
      - "SharpTS.Gui.Conformance.Tests/**"
      - "SharpTS.Gui.Sdk.Consumer/**"
      - "SharpTS.Gui.Sdk/**"
      - "SharpTS.Sdk.Tasks/**"
      - "Directory.Build.props"
      - "eng/GuiPreviewVersion.props"
      - "global.json"
      - "distribution/macos/**"
      - "scripts/get-gui-preview-version.ps1"
      - "scripts/sync-gui-preview-version.ps1"
      - "scripts/package-gui-macos.ps1"
      - "scripts/test-gui-macos-package.ps1"
      - ".github/workflows/macos-desktop-preview.yml"
      - ".github/workflows/macos-gui-distribution.yml"
      - ".github/workflows/reusable-macos-gui-distribution.yml"

permissions:
  contents: read

jobs:
  gui-sdk-candidate:
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      version: ${{ steps.gui_version.outputs.version }}
      marketing_version: ${{ steps.gui_version.outputs.marketing_version }}
      package_file_name: ${{ steps.gui_version.outputs.package_file_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Read GUI preview version
        id: gui_version
        shell: pwsh
        run: |
          $info = ./scripts/get-gui-preview-version.ps1
          "version=$($info.Version)" >> $env:GITHUB_OUTPUT
          "marketing_version=$($info.MarketingVersion)" >> $env:GITHUB_OUTPUT
          "package_file_name=$($info.PackageFileName)" >> $env:GITHUB_OUTPUT
      - name: macOS bundle contract tests
        shell: pwsh
        run: scripts/test-gui-macos-package.ps1
      - name: Build and audit the exact GUI SDK candidate
        shell: pwsh
        run: SharpTS.Gui.Sdk.Consumer/Run-PackagedConsumer.ps1 -RuntimeIdentifier osx-arm64 -PackageOnly
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sharpts-gui-sdk-candidate
          path: artifacts/macos-preview/osx-arm64/feed/${{ steps.gui_version.outputs.package_file_name }}

  macos-native:
    needs: gui-sdk-candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            architecture: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sharpts-gui-sdk-candidate
          path: artifacts/macos-preview/candidate
      - name: Hosted scheduler and lifecycle conformance
        run: dotnet test SharpTS.Tests/SharpTS.Tests.csproj -c Release --filter "FullyQualifiedName~HostedInterpreterRuntimeTests|FullyQualifiedName~Parse_Compile_Hosted"
      - name: Renderer, diagnostics, and productization conformance
        run: dotnet test SharpTS.Gui.Conformance.Tests/SharpTS.Gui.Conformance.Tests.csproj -c Release
      - name: Native packaged SDK, CLI, Headless, and real-window gates
        shell: pwsh
        run: SharpTS.Gui.Sdk.Consumer/Run-PackagedConsumer.ps1 -RuntimeIdentifier ${{ matrix.rid }} -RealWindow -CandidatePackage "artifacts/macos-preview/candidate/${{ needs.gui-sdk-candidate.outputs.package_file_name }}"
      - name: Validate and archive unsigned app bundle
        shell: pwsh
        run: >-
          scripts/package-gui-macos.ps1
          -PublishDirectory "artifacts/macos-preview/${{ matrix.rid }}/published single file"
          -OutputDirectory "artifacts/macos-preview/${{ matrix.rid }}/bundle"
          -BundleIdentifier dev.sharpts.gui.preview
          -DisplayName "SharpTS GUI Preview"
          -ShortVersion ${{ needs.gui-sdk-candidate.outputs.marketing_version }}
          -BuildVersion ${{ github.run_number }}
          -Architecture ${{ matrix.architecture }}
          -Executable SharpTS.Gui.Sdk.Consumer
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: macos-desktop-preview-${{ matrix.architecture }}
          path: |
            artifacts/macos-preview/${{ matrix.rid }}/*-trace.json
            artifacts/macos-preview/${{ matrix.rid }}/published single file/SharpTS.Gui.Sdk.Consumer
            artifacts/macos-preview/${{ matrix.rid }}/cli published single file/cli_app_with_spaces
            artifacts/macos-preview/${{ matrix.rid }}/bundle/*.zip
            artifacts/macos-preview/${{ matrix.rid }}/bundle/SHA256SUMS
          if-no-files-found: error
