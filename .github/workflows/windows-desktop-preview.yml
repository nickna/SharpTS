name: Windows desktop preview

on:
  workflow_dispatch:
    inputs:
      run_arm64_native:
        description: Run the real-window gate on a registered Windows ARM64 runner
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - "Execution/Interpreter.cs"
      - "Execution/Interpreter.Hosting.cs"
      - "Hosting/**"
      - "SharpTS.Hosting.Abstractions/**"
      - "Parsing/TopLevelAwaitDetector.cs"
      - "TypeSystem/**"
      - "Runtime/BuiltIns/ProcessBuiltIns.cs"
      - "Runtime/BuiltIns/PromiseBuiltIns.cs"
      - "Runtime/BuiltIns/TimerBuiltIns.cs"
      - "SharpTS.Tests/Hosting/**"
      - "Compilation/**"
      - "Cli/**"
      - "References/SharpTsManifest.cs"
      - "SharpTS.Tests/CliTests/**"
      - "Program.cs"
      - "SharpTS.Gui/**"
      - "SharpTS.Gui.Host/**"
      - "SharpTS.Gui.Conformance.Tests/**"
      - "SharpTS.Gui.Sdk.Consumer/**"
      - "SharpTS.Gui.Sdk/**"
      - "SharpTS.Sdk.Tasks/**"
      - "Directory.Build.props"
      - "eng/GuiPreviewVersion.props"
      - "global.json"
      - "distribution/windows/**"
      - "scripts/get-gui-preview-version.ps1"
      - "scripts/sync-gui-preview-version.ps1"
      - "scripts/package-gui-windows.ps1"
      - "scripts/generate-gui-windows-assets.ps1"
      - "scripts/collect-gui-support-bundle.ps1"
      - "scripts/test-gui-distribution.ps1"
      - ".github/workflows/windows-gui-distribution.yml"
      - ".github/workflows/reusable-windows-gui-distribution.yml"
      - "SharpTS.csproj"
      - "SharpTS.sln"
      - ".github/workflows/windows-desktop-preview.yml"

permissions:
  contents: read

jobs:
  gui-sdk-candidate:
    runs-on: windows-2025
    timeout-minutes: 15
    outputs:
      version: ${{ steps.gui_version.outputs.version }}
      marketing_version: ${{ steps.gui_version.outputs.marketing_version }}
      package_file_name: ${{ steps.gui_version.outputs.package_file_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Read GUI preview version
        id: gui_version
        shell: pwsh
        run: |
          $info = ./scripts/get-gui-preview-version.ps1
          "version=$($info.Version)" >> $env:GITHUB_OUTPUT
          "marketing_version=$($info.MarketingVersion)" >> $env:GITHUB_OUTPUT
          "package_file_name=$($info.PackageFileName)" >> $env:GITHUB_OUTPUT
      - name: Distribution manifest, evidence, update, and support-bundle tests
        shell: pwsh
        run: scripts/test-gui-distribution.ps1
      - name: Build and audit the exact GUI SDK candidate
        shell: pwsh
        run: SharpTS.Gui.Sdk.Consumer/Run-PackagedConsumer.ps1 -RuntimeIdentifier win-x64 -PackageOnly
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sharpts-gui-sdk-candidate
          path: artifacts/windows-preview/win-x64/feed/${{ steps.gui_version.outputs.package_file_name }}

  windows-x64:
    needs: gui-sdk-candidate
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sharpts-gui-sdk-candidate
          path: artifacts/windows-preview/candidate
      - name: Hosted scheduler and lifecycle conformance
        run: dotnet test SharpTS.Tests/SharpTS.Tests.csproj -c Release --filter "FullyQualifiedName~HostedInterpreterRuntimeTests|FullyQualifiedName~Parse_Compile_Hosted"
      - name: Renderer core and dual-mode headless integration
        run: dotnet test SharpTS.Gui.Conformance.Tests/SharpTS.Gui.Conformance.Tests.csproj -c Release
      - name: Packaged x64 SDK, Native AOT, performance budgets, and real windows
        shell: pwsh
        run: SharpTS.Gui.Sdk.Consumer/Run-PackagedConsumer.ps1 -RuntimeIdentifier win-x64 -RealWindow -NativeAot -EnforcePerformanceBudgets -CandidatePackage "artifacts/windows-preview/candidate/${{ needs.gui-sdk-candidate.outputs.package_file_name }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: windows-desktop-preview-x64
          path: |
            artifacts/windows-preview/win-x64/*-trace.json
            artifacts/windows-preview/win-x64/feed/*.nupkg
            artifacts/windows-preview/win-x64/published single file/*.exe
            artifacts/windows-preview/win-x64/published native aot/*.exe
            artifacts/windows-preview/win-x64/cli published single file/*.exe

  windows-arm64-cross-publish:
    needs: gui-sdk-candidate
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sharpts-gui-sdk-candidate
          path: artifacts/windows-preview/candidate
      - name: Cross-publish packaged ARM64 directory and single-file outputs
        shell: pwsh
        run: SharpTS.Gui.Sdk.Consumer/Run-PackagedConsumer.ps1 -RuntimeIdentifier win-arm64 -PublishOnly -CandidatePackage "artifacts/windows-preview/candidate/${{ needs.gui-sdk-candidate.outputs.package_file_name }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: windows-desktop-preview-arm64-cross-publish
          path: |
            artifacts/windows-preview/win-arm64/feed/*.nupkg
            artifacts/windows-preview/win-arm64/published single file/*.exe
            artifacts/windows-preview/win-arm64/cli published single file/*.exe

  windows-arm64-native:
    needs: gui-sdk-candidate
    if: github.event_name == 'workflow_dispatch' && inputs.run_arm64_native
    runs-on: [self-hosted, Windows, ARM64, sharpts-gui]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sharpts-gui-sdk-candidate
          path: artifacts/windows-preview/candidate
      - name: Packaged ARM64 SDK, Native AOT, performance budgets, and real windows
        shell: pwsh
        run: SharpTS.Gui.Sdk.Consumer/Run-PackagedConsumer.ps1 -RuntimeIdentifier win-arm64 -RealWindow -NativeAot -EnforcePerformanceBudgets -CandidatePackage "artifacts/windows-preview/candidate/${{ needs.gui-sdk-candidate.outputs.package_file_name }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: windows-desktop-preview-arm64-native
          path: |
            artifacts/windows-preview/win-arm64/*-trace.json
            artifacts/windows-preview/win-arm64/feed/*.nupkg
            artifacts/windows-preview/win-arm64/published single file/*.exe
            artifacts/windows-preview/win-arm64/published native aot/*.exe
            artifacts/windows-preview/win-arm64/cli published single file/*.exe
