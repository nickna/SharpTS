name: Windows GUI distribution certification

on:
  workflow_dispatch:
    inputs:
      package_identity:
        description: Immutable MSIX identity name
        required: true
        type: string
      display_name:
        description: Application display name
        required: true
        default: SharpTS GUI Preview
        type: string
      version:
        description: Four-part MSIX version
        required: true
        type: string
      package_uri:
        description: Final HTTPS URI of the versioned MSIX
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Build and execute warning-clean x64 Native AOT candidate
        shell: pwsh
        run: SharpTS.Gui.Sdk.Consumer/Run-PackagedConsumer.ps1 -RuntimeIdentifier win-x64 -NativeAot -EnforcePerformanceBudgets

      - name: Stage reusable distribution input
        shell: pwsh
        run: |
          $root = 'artifacts/windows-distribution-input'
          New-Item -ItemType Directory -Path "$root/publish", "$root/assets" -Force | Out-Null
          Copy-Item -Path 'artifacts/windows-preview/win-x64/published native aot/*' -Destination "$root/publish" -Recurse -Force
          Copy-Item -Path 'distribution/windows/assets/*.png' -Destination "$root/assets" -Force

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-gui-certification-payload
          path: artifacts/windows-distribution-input
          if-no-files-found: error

  sign-and-package:
    needs: build-candidate
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/reusable-windows-gui-distribution.yml
    with:
      payload_artifact: windows-gui-certification-payload
      executable: SharpTS.Gui.Sdk.Consumer.exe
      package_identity: ${{ inputs.package_identity }}
      display_name: ${{ inputs.display_name }}
      version: ${{ inputs.version }}
      package_uri: ${{ inputs.package_uri }}
      architecture: x64
    secrets: inherit
