name: Reusable macOS GUI distribution

on:
  workflow_call:
    inputs:
      payload_artifact:
        description: Artifact containing the already-published application in publish/
        required: true
        type: string
      executable:
        description: Executable file name at the publish root
        required: true
        type: string
      bundle_identifier:
        required: true
        type: string
      display_name:
        required: true
        type: string
      short_version:
        required: true
        type: string
      build_version:
        required: true
        type: string
      architecture:
        required: false
        default: arm64
        type: string
      environment_name:
        required: false
        default: macos-gui-distribution
        type: string
    secrets:
      MACOS_DEVELOPER_ID_P12_BASE64:
        required: true
      MACOS_DEVELOPER_ID_P12_PASSWORD:
        required: true
      MACOS_NOTARY_KEY_BASE64:
        required: true
      MACOS_NOTARY_KEY_ID:
        required: true
      MACOS_NOTARY_ISSUER_ID:
        required: true
      MACOS_DEVELOPER_ID_APPLICATION:
        required: true
    outputs:
      distribution_artifact:
        description: Name of the uploaded signed distribution artifact
        value: ${{ jobs.sign-notarize.outputs.distribution_artifact }}

permissions:
  contents: read

jobs:
  sign-notarize:
    runs-on: macos-15
    timeout-minutes: 45
    environment: ${{ inputs.environment_name }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      distribution_artifact: ${{ steps.artifact_name.outputs.value }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.payload_artifact }}
          path: artifacts/distribution-input

      - name: Validate distribution input
        shell: pwsh
        env:
          EXECUTABLE: ${{ inputs.executable }}
        run: |
          $publish = 'artifacts/distribution-input/publish'
          if (-not (Test-Path -LiteralPath $publish -PathType Container)) { throw 'The payload artifact must contain publish/.' }
          if ([IO.Path]::GetFileName($env:EXECUTABLE) -ne $env:EXECUTABLE) { throw 'Executable must be a file name.' }
          if (-not (Test-Path -LiteralPath (Join-Path $publish $env:EXECUTABLE) -PathType Leaf)) { throw 'Executable is missing from publish/.' }

      - name: Import Developer ID certificate and configure notarization
        shell: bash
        env:
          P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          test -n "$P12_BASE64" && test -n "$P12_PASSWORD"
          test -n "$NOTARY_KEY_BASE64" && test -n "$NOTARY_KEY_ID" && test -n "$NOTARY_ISSUER_ID"
          keychain="$RUNNER_TEMP/sharpts-signing.keychain-db"
          password="$(uuidgen)$(uuidgen)"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          xcrun notarytool store-credentials sharpts-gui-notary --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          printf 'SIGNING_KEYCHAIN=%s\n' "$keychain" >> "$GITHUB_ENV"

      - name: Sign, notarize, staple, and validate app and DMG
        shell: pwsh
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          BUNDLE_IDENTIFIER: ${{ inputs.bundle_identifier }}
          DISPLAY_NAME: ${{ inputs.display_name }}
          SHORT_VERSION: ${{ inputs.short_version }}
          BUILD_VERSION: ${{ inputs.build_version }}
          PACKAGE_ARCHITECTURE: ${{ inputs.architecture }}
          EXECUTABLE: ${{ inputs.executable }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_IDENTITY)) { throw 'The protected environment must provide a Developer ID Application identity.' }
          scripts/package-gui-macos.ps1 `
            -PublishDirectory 'artifacts/distribution-input/publish' `
            -OutputDirectory 'artifacts/macos-distribution' `
            -BundleIdentifier $env:BUNDLE_IDENTIFIER `
            -DisplayName $env:DISPLAY_NAME `
            -ShortVersion $env:SHORT_VERSION `
            -BuildVersion $env:BUILD_VERSION `
            -Architecture $env:PACKAGE_ARCHITECTURE `
            -Executable $env:EXECUTABLE `
            -SigningIdentity $env:SIGNING_IDENTITY `
            -NotaryKeychainProfile sharpts-gui-notary `
            -CreateDmg `
            -RequireSigned `
            -RequireNotarized

      - name: Attest signed distribution provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            artifacts/macos-distribution/*.zip
            artifacts/macos-distribution/*.dmg

      - name: Set artifact name
        id: artifact_name
        shell: pwsh
        run: '"value=signed-macos-gui-${{ inputs.architecture }}" >> $env:GITHUB_OUTPUT'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-macos-gui-${{ inputs.architecture }}
          path: |
            artifacts/macos-distribution/*.zip
            artifacts/macos-distribution/*.dmg
            artifacts/macos-distribution/SHA256SUMS
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"
          if [[ -n "${SIGNING_KEYCHAIN:-}" && -f "$SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi
